<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Números Aleatorios</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    -webkit-user-select: none;
    user-select: none;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #keepalive-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    z-index: -1;
  }

  #number-display {
    color: #fff;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 900;
    text-align: center;
    line-height: 1;
    font-size: clamp(8rem, 55vmin, 40rem);
    font-variant-numeric: tabular-nums;
  }

  #fullscreen-btn {
    position: fixed;
    bottom: 5vh;
    left: 50%;
    transform: translateX(-50%);
    padding: 0.8em 1.6em;
    font-size: 1.1rem;
    color: #fff;
    background: #000;
    border: 2px solid #fff;
    border-radius: 0.4em;
    cursor: pointer;
  }

  #fullscreen-btn.hidden {
    display: none;
  }

  #status {
    position: fixed;
    bottom: 1.5vh;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 0.8rem;
  }
</style>
</head>

  <div id="number-display" aria-live="polite"></div>
  <button id="fullscreen-btn" type="button">Pantalla completa</button>
  <div id="status"></div>
</div>
<script>
(function () {
  "use strict";

  var display = document.getElementById("number-display");
  var fullscreenBtn = document.getElementById("fullscreen-btn");
  var INTERVAL_MS = 20000;

  function showRandomNumber() {
    display.textContent = "";
    var n = Math.floor(Math.random() * 100); // 0-99
    display.textContent = String(n).padStart(2, "0");
  }

  function isFullscreen() {
    return !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.msFullscreenElement
    );
  }

  function requestFullscreen() {
    var el = document.documentElement;
    var request =
      el.requestFullscreen ||
      el.webkitRequestFullscreen ||
      el.msRequestFullscreen;
    if (request) {
      request.call(el).catch(function () {});
    }
  }

  function updateFullscreenButton() {
    fullscreenBtn.classList.toggle("hidden", isFullscreen());
  }

  var statusEl = document.getElementById("status");
  var keepaliveVideo = document.getElementById("keepalive-video");
  var wakeLockSentinel = null;

  function requestWakeLock() {
    if (!("wakeLock" in navigator)) {
      return Promise.resolve(false);
    }
    return navigator.wakeLock
      .request("screen")
      .then(function (sentinel) {
        wakeLockSentinel = sentinel;
        // El sistema puede liberar el bloqueo por su cuenta (cambio de app,
        // ahorro de batería, etc.); si la página sigue visible, lo repedimos.
        sentinel.addEventListener("release", function () {
          wakeLockSentinel = null;
          updateStatus();
          if (document.visibilityState === "visible") {
            keepScreenAwake();
          }
        });
        return true;
      })
      .catch(function () {
        return false;
      });
  }

  // Respaldo para navegadores/dispositivos donde la Wake Lock API no está
  // disponible o falla: un vídeo mudo en bucle también evita el apagado
  // automático de la pantalla en la mayoría de móviles.
  function startVideoKeepAwake() {
    if (!keepaliveVideo) {
      return Promise.resolve(false);
    }
    var playPromise = keepaliveVideo.play();
    if (!playPromise || !playPromise.then) {
      return Promise.resolve(!keepaliveVideo.paused);
    }
    // Algunos navegadores nunca resuelven ni rechazan esta promesa si la
    // fuente no llega a cargar; con un límite de tiempo evitamos que eso
    // bloquee el resto de la lógica de "pantalla activa".
    var timeout = new Promise(function (resolve) {
      setTimeout(function () {
        resolve(!keepaliveVideo.paused);
      }, 2000);
    });
    return Promise.race([
      playPromise.then(
        function () {
          return true;
        },
        function () {
          return false;
        }
      ),
      timeout,
    ]);
  }

  function updateStatus() {
    if (wakeLockSentinel) {
      statusEl.textContent = "Pantalla activa (bloqueo del sistema)";
    } else if (keepaliveVideo && !keepaliveVideo.paused) {
      statusEl.textContent = "Pantalla activa (modo alternativo)";
    } else {
      statusEl.textContent =
        "No se pudo evitar el apagado automático de la pantalla";
    }
  }

  function keepScreenAwake() {
    Promise.all([requestWakeLock(), startVideoKeepAwake()]).then(updateStatus);
  }

  fullscreenBtn.addEventListener("click", function () {
    requestFullscreen();
    keepScreenAwake();
  });

  ["fullscreenchange", "webkitfullscreenchange", "msfullscreenchange"].forEach(
    function (evt) {
      document.addEventListener(evt, updateFullscreenButton);
    }
  );

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      keepScreenAwake();
    }
  });

  // Red de seguridad: si por lo que sea se perdió el bloqueo sin disparar
  // el evento "release", lo comprobamos y volvemos a intentarlo.
  setInterval(function () {
    if (document.visibilityState === "visible" && !wakeLockSentinel) {
      keepScreenAwake();
    }
  }, 15000);

  updateFullscreenButton();
  requestFullscreen();
  keepScreenAwake();

  showRandomNumber();
  setInterval(showRandomNumber, INTERVAL_MS);
})();
</script>
</body>
</html>
