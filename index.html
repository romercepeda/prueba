<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Números Aleatorios</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    -webkit-user-select: none;
    user-select: none;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #number-display {
    color: #fff;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 900;
    text-align: center;
    line-height: 1;
    font-size: clamp(8rem, 55vmin, 40rem);
    font-variant-numeric: tabular-nums;
  }

  #fullscreen-btn {
    position: fixed;
    bottom: 5vh;
    left: 50%;
    transform: translateX(-50%);
    padding: 0.8em 1.6em;
    font-size: 1.1rem;
    color: #fff;
    background: #000;
    border: 2px solid #fff;
    border-radius: 0.4em;
    cursor: pointer;
  }

  #fullscreen-btn.hidden {
    display: none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="number-display" aria-live="polite"></div>
  <button id="fullscreen-btn" type="button">Pantalla completa</button>
</div>
<script>
(function () {
  "use strict";

  var display = document.getElementById("number-display");
  var fullscreenBtn = document.getElementById("fullscreen-btn");
  var INTERVAL_MS = 20000;

  function showRandomNumber() {
    display.textContent = "";
    var n = Math.floor(Math.random() * 100); // 0-99
    display.textContent = String(n).padStart(2, "0");
  }

  function isFullscreen() {
    return !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.msFullscreenElement
    );
  }

  function requestFullscreen() {
    var el = document.documentElement;
    var request =
      el.requestFullscreen ||
      el.webkitRequestFullscreen ||
      el.msRequestFullscreen;
    if (request) {
      request.call(el).catch(function () {});
    }
  }

  function updateFullscreenButton() {
    fullscreenBtn.classList.toggle("hidden", isFullscreen());
  }

  var wakeLockSentinel = null;

  function requestWakeLock() {
    if (!("wakeLock" in navigator)) {
      return;
    }
    navigator.wakeLock
      .request("screen")
      .then(function (sentinel) {
        wakeLockSentinel = sentinel;
        // El sistema puede liberar el bloqueo por su cuenta (cambio de app,
        // ahorro de batería, etc.); si la página sigue visible, lo repedimos.
        sentinel.addEventListener("release", function () {
          wakeLockSentinel = null;
          if (document.visibilityState === "visible") {
            requestWakeLock();
          }
        });
      })
      .catch(function () {});
  }

  fullscreenBtn.addEventListener("click", function () {
    requestFullscreen();
    requestWakeLock();
  });

  ["fullscreenchange", "webkitfullscreenchange", "msfullscreenchange"].forEach(
    function (evt) {
      document.addEventListener(evt, updateFullscreenButton);
    }
  );

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      requestWakeLock();
    }
  });

  // Red de seguridad: si por lo que sea el bloqueo se perdió sin disparar
  // el evento "release", lo comprobamos y volvemos a pedirlo.
  setInterval(function () {
    if (document.visibilityState === "visible" && !wakeLockSentinel) {
      requestWakeLock();
    }
  }, 15000);

  updateFullscreenButton();
  requestFullscreen();
  requestWakeLock();

  showRandomNumber();
  setInterval(showRandomNumber, INTERVAL_MS);
})();
</script>
</body>
</html>
