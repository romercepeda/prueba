<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Números Aleatorios</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    -webkit-user-select: none;
    user-select: none;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #number-display {
    color: #fff;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 700;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1.2;
    padding: 0 4vw;
    font-size: clamp(2.5rem, 9vw, 9rem);
  }

  #fullscreen-btn {
    position: fixed;
    bottom: 5vh;
    left: 50%;
    transform: translateX(-50%);
    padding: 0.8em 1.6em;
    font-size: 1.1rem;
    color: #fff;
    background: #000;
    border: 2px solid #fff;
    border-radius: 0.4em;
    cursor: pointer;
  }

  #fullscreen-btn.hidden {
    display: none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="number-display" aria-live="polite"></div>
  <button id="fullscreen-btn" type="button">Pantalla completa</button>
</div>
<script>
(function () {
  "use strict";

  var UNITS = [
    "cero", "uno", "dos", "tres", "cuatro",
    "cinco", "seis", "siete", "ocho", "nueve"
  ];

  var TEENS = [
    "diez", "once", "doce", "trece", "catorce",
    "quince", "dieciséis", "diecisiete", "dieciocho", "diecinueve"
  ];

  var TWENTIES = [
    "veinte", "veintiuno", "veintidós", "veintitrés", "veinticuatro",
    "veinticinco", "veintiséis", "veintisiete", "veintiocho", "veintinueve"
  ];

  var TENS = {
    3: "treinta", 4: "cuarenta", 5: "cincuenta",
    6: "sesenta", 7: "setenta", 8: "ochenta", 9: "noventa"
  };

  // Números 0-9 se leen dígito a dígito (ej. 08 -> "cero ocho").
  // Números 10-99 se leen como la palabra completa (ej. 26 -> "veintiséis").
  function numberToWords(n) {
    if (n < 10) {
      return "cero " + UNITS[n];
    }
    if (n < 20) {
      return TEENS[n - 10];
    }
    if (n < 30) {
      return TWENTIES[n - 20];
    }

    var tenDigit = Math.floor(n / 10);
    var unitDigit = n % 10;
    var tenWord = TENS[tenDigit];

    return unitDigit === 0 ? tenWord : tenWord + " y " + UNITS[unitDigit];
  }

  var display = document.getElementById("number-display");
  var fullscreenBtn = document.getElementById("fullscreen-btn");
  var INTERVAL_MS = 20000;

  function showRandomNumber() {
    display.textContent = "";
    var n = Math.floor(Math.random() * 100); // 0-99
    display.textContent = numberToWords(n);
  }

  function isFullscreen() {
    return !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.msFullscreenElement
    );
  }

  function requestFullscreen() {
    var el = document.documentElement;
    var request =
      el.requestFullscreen ||
      el.webkitRequestFullscreen ||
      el.msRequestFullscreen;
    if (request) {
      request.call(el).catch(function () {});
    }
  }

  function updateFullscreenButton() {
    fullscreenBtn.classList.toggle("hidden", isFullscreen());
  }

  function requestWakeLock() {
    if ("wakeLock" in navigator) {
      navigator.wakeLock.request("screen").catch(function () {});
    }
  }

  fullscreenBtn.addEventListener("click", function () {
    requestFullscreen();
    requestWakeLock();
  });

  ["fullscreenchange", "webkitfullscreenchange", "msfullscreenchange"].forEach(
    function (evt) {
      document.addEventListener(evt, updateFullscreenButton);
    }
  );

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      requestWakeLock();
    }
  });

  updateFullscreenButton();
  requestFullscreen();
  requestWakeLock();

  showRandomNumber();
  setInterval(showRandomNumber, INTERVAL_MS);
})();
</script>
</body>
</html>
